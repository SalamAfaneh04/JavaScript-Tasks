<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task four</title>
</head>
<body>
    <h1>Simple Condition</h1>
    <script>
        function check (){
            let x = Number(prompt("Enter the value for x:"));
            let y = Number(prompt("Enter the value for y:"));
            let message;

            if (x > y) {
                message = "Hello World";
            } else {
                message = "Goodbye";
            }
            alert(message);
            console.log(message);
            document.writeln(message) ;
        }
    </script>

    <input type="button" value="Check" onclick="check()">

</body>
</html>
